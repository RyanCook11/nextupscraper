[project]
name = "scrapbot"
version = "0.1.0"
description = "Company / lead data scraper for NextUp Recruitment"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # The NAIA publishes its member institutions only as a PDF.
    "pypdf>=4.0",
    # Reading hand-maintained school lists supplied as spreadsheets.
    "openpyxl>=3.1",
    # Patches the headless-Chrome tells (window.chrome, navigator.plugins,
    # navigator.languages). 2.0 renamed the entry point to Stealth.apply_stealth_async.
    "playwright-stealth>=2.0",
    # Reads .env so the API key and tuning knobs live in the project, not the
    # shell. See scrapbot.config._load_dotenv.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "browser: needs a real Playwright browser (deselect with -m 'not browser')",
]

[project.scripts]
scrapbot = "scrapbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scrapbot*"]

[tool.setuptools.package-data]
"scrapbot.web" = ["static/*"]
